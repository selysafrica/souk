# Souk derrière le Nginx du serveur : Nginx termine le TLS (certbot) et transmet à l'application.
#   cp deploy/nginx.conf /etc/nginx/sites-available/souk
#   ln -s ../sites-available/souk /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d souk.selys.app
# Le port (4310) doit correspondre à APP_PORT dans .env.
server {
	listen 80;
	listen [::]:80;
	server_name souk.selys.app;

	# Ne pas afficher la version de Nginx (en-tête Server, pages d'erreur).
	server_tokens off;

	# Aucun envoi de fichier : formulaires et API admin en JSON uniquement.
	client_max_body_size 1m;

	location / {
		proxy_pass http://127.0.0.1:4310;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		# Remplace (et non complète) l'en-tête envoyé par le client : il ne doit pas choisir son adresse.
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_read_timeout 120s;
	}
}
